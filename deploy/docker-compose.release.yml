# Clean-server Compose release. Build from the matching source tag once, then
# retain these version-tagged local images for platform rollback.
name: healer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-healer}
    volumes:
      - healer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healer} -d ${POSTGRES_DB:-healer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [healer-net]

  redis:
    image: redis:7-alpine
    volumes:
      - healer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [healer-net]

  control-plane:
    image: healer-control-plane:${HEALER_VERSION:-1.0.0}
    build:
      context: ../services/control-plane
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-healer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-healer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${CONTROL_PLANE_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [healer-net]

  worker:
    image: healer-worker:${HEALER_VERSION:-1.0.0}
    build:
      context: ../services/worker
    env_file: ../.env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [healer-net]

  dashboard:
    image: healer-dashboard:${HEALER_VERSION:-1.0.0}
    build:
      context: ../apps/dashboard
    # NEXT_PUBLIC_* is baked by Next.js at build time. Build at container
    # startup so the configured public API URL is used on this installation.
    command: ["sh", "-c", "npm run build && npm run start -- -H 0.0.0.0"]
    env_file: ../.env
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:?set the browser-accessible API URL in .env}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - control-plane
    networks: [healer-net]

  gateway-manager:
    image: healer-gateway-manager:${HEALER_VERSION:-1.0.0}
    build:
      context: ../services/gateway-manager
    env_file: ../.env
    ports:
      - "127.0.0.1:${GATEWAY_MANAGER_PORT:-8100}:8100"
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/healer/certs:ro
    networks: [healer-net]

networks:
  healer-net:
    driver: bridge

volumes:
  healer_postgres_data:
  healer_redis_data:
