# Copied into /etc/nginx/conf.d/ at image build time. Stock Debian nginx
# already includes everything directly under conf.d/ from its own
# nginx.conf — this one static file is the only thing Healer adds there.
# The actual per-application files live one level down, in the directory
# services/gateway-manager/app/services/nginx_manager.py exclusively
# writes to (settings.nginx_managed_dir) — never this file, and never
# anything outside that one directory.
include /etc/nginx/conf.d/healer/*.conf;
